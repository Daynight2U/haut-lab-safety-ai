name: syntax-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验油猴脚本语法
        run: node --check HAUT-lab-safety-ai.user.js

      - name: 检查元数据完整性
        run: |
          set -e
          for key in "@name" "@namespace" "@version" "@match" "@run-at"; do
            grep -q "^// $key" HAUT-lab-safety-ai.user.js || { echo "缺少元数据 $key"; exit 1; }
          done
          echo "元数据齐全"
